# Publishes a GitHub Release when a version tag is pushed (RELEASING.md). HACS installs the release's
# ohmie.zip (hacs.json zip_release), so a member gets exactly what this workflow built and attested.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    env:
      TAG: ${{ github.ref_name }}
      ZIP: ohmie.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag, the version files and the changelog agree
        run: python3 scripts/release.py --check "$TAG"
      - name: Build the zip that HACS installs
        run: |
          cd custom_components/ohmie
          zip -r -X "$GITHUB_WORKSPACE/$ZIP" . -x '*__pycache__*' '*.pyc'
          cd "$GITHUB_WORKSPACE"
          unzip -l "$ZIP" | grep -q ' manifest.json$'
          sha256sum "$ZIP" | tee "$ZIP.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ZIP }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py --notes "$TAG" > notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" --verify-tag --title "$TAG" \
            --notes-file notes.md $pre
