# Publishes a GitHub Release when a version tag is pushed (RELEASING.md). HACS installs the release's
# ohmie.zip (hacs.json zip_release), so a member gets exactly what this workflow built and attested.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failed command in a pipe fails the step

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    env:
      TAG: ${{ github.ref_name }}
      ASSET: ohmie.zip   # not ZIP: Info-ZIP reads $ZIP as its own options (v0.1.0 failed so)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag, the version files and the changelog agree
        run: python3 scripts/release.py --check "$TAG"
      - name: Build the zip that HACS installs
        run: python3 scripts/release.py --build "$ASSET" | tee "$ASSET.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py --notes "$TAG" > notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" --verify-tag --title "$TAG" \
            --notes-file notes.md $pre
