name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml runs the same checks before it publishes

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failed command in a pipe fails the step

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master, 2026-10-13

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-10-13
        with:
          category: integration

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: actionlint (syntax)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: zizmor (security)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.11.0 --format=github .github/workflows

  test:
    runs-on: ubuntu-latest
    env:
      NATS_VERSION: v2.15.0   # the server version Ohmie runs (Infra nats_deployment.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.14
      - name: nats-server, for the NATS link tests
        run: |
          curl -sSfL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz" | tar xz
          echo "NATS_SERVER_BIN=$PWD/nats-server-${NATS_VERSION}-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy custom_components/ohmie
      - run: uv run pytest -q
